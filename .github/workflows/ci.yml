name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      NEXT_PUBLIC_APP_ENV: local
      NEXT_PUBLIC_RELEASE_VERSION: 0.1.0-beta.1
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      USDA_FDC_API_KEY: ci-usda-key
      OPEN_FOOD_FACTS_USER_AGENT: MTFBWU/0.1.0 (ci@example.com)
      RATE_LIMIT_BACKEND: none

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Secret scanning (basic)
        run: |
          set -euo pipefail
          # Exclude workflow definitions so the pattern literals themselves are not hits.
          if grep -RInE --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.github --exclude=pnpm-lock.yaml \
            -e 'BEGIN (RSA|OPENSSH) PRIVATE KEY' \
            -e 'sk_live_[0-9a-zA-Z]{8,}' \
            . ; then
            echo "::error::possible secret material found in working tree"
            exit 1
          fi
          echo "Basic secret scan clean"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.109.1

      - name: Start local Supabase
        run: supabase start

      - name: Map local Supabase env for app + E2E
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"

      - name: Reset local database (apply Increment 3–10 migrations and seed)
        run: supabase db reset

      - name: Run Increment 3–10 DB tests
        run: |
          set -euo pipefail
          DB_CONTAINER=$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n1)
          if [ -z "$DB_CONTAINER" ]; then
            echo "::error::could not find a running supabase_db_* container"
            docker ps
            exit 1
          fi
          echo "Using database container: $DB_CONTAINER"
          for suite in \
            increment3_auth_board_rls.sql \
            increment4_nutrition_rls.sql \
            increment5_label_rls.sql \
            increment6_workout_rls.sql \
            increment7_rehab_rls.sql \
            increment8_progress_rls.sql \
            increment9_daily_rls.sql \
            increment10_account_lifecycle_rls.sql
          do
            docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
              < "supabase/tests/$suite"
          done

      - name: Generate + validate Supabase TypeScript types
        run: |
          set -euo pipefail
          supabase gen types typescript --local > /tmp/types.generated.ts
          for table in foods barcodes branded_products meal_logs nutrition_label_captures workout_sessions exercise_definitions rehab_sessions rehab_plans rehab_exercise_definitions rehab_alert_events body_weight_entries progress_photo_sets measurement_definitions account_deletion_requests account_export_requests; do
            if ! grep -qE "^ *${table}: \\{" /tmp/types.generated.ts; then
              echo "::error::generated local schema is missing table '${table}'"
              exit 1
            fi
          done
          for needle in branded_product_id nutrition_label_captures workout_sessions rehab_sessions body_weight_entries hydration_entries meditation_sessions sleep_sessions tracker_definitions user_trackers cleanup_stage file_count; do
            if ! grep -q "$needle" src/shared/database/database.types.ts; then
              echo "::error::database.types.ts missing ${needle} — regenerate after migrations"
              exit 1
            fi
          done

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright critical smoke suite
        run: pnpm test:e2e:smoke

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Dependency audit (production)
        run: pnpm run audit

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
